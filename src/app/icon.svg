<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="6" y1="1.5" x2="26" y2="30.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#7c2d12" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Orange gradient rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Soft top highlight for depth -->
  <rect width="32" height="16" rx="7" fill="#ffffff" opacity="0.12"/>
  <!-- Bold lightning bolt, enlarged to fill the canvas -->
  <path d="M20.5 1.5 L6 18.5 L13.5 18.5 L11.5 30.5 L26 12 L18 12 Z"
        fill="url(#bolt)" filter="url(#boltShadow)"
        stroke="#ffffff" stroke-width="0.7" stroke-linejoin="round"/>
</svg>

