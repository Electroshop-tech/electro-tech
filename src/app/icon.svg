<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="10" y1="3" x2="22" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#7c2d12" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Orange gradient rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Soft top highlight for depth -->
  <rect width="32" height="16" rx="8" fill="#ffffff" opacity="0.12"/>
  <!-- Bold lightning bolt, centered and balanced -->
  <path d="M19 3 L8.5 17.5 L14.5 17.5 L13 29 L23.5 13.5 L17.5 13.5 Z"
        fill="url(#bolt)" filter="url(#boltShadow)"
        stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round"/>
</svg>

